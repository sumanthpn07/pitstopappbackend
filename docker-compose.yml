services:
  db:
    image: postgres:16-alpine
    container_name: pitstop-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: pitstop
      POSTGRES_PASSWORD: pitstop
      POSTGRES_DB: pitstop
    ports:
      # Host port (default 5434) -> container 5432, to avoid clashing with a
      # local Postgres. Override with DB_PORT in your environment if needed.
      - "${DB_PORT:-5434}:5432"
    volumes:
      - pitstop-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pitstop -d pitstop"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: .
    container_name: pitstop-api
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      # Talks to the db service over the internal network (NOT localhost:5434).
      DATABASE_URL: "postgresql://pitstop:pitstop@db:5432/pitstop?schema=public"
      PORT: "4000"
      CORS_ORIGINS: "${CORS_ORIGINS:-*}"
      JWT_SECRET: "${JWT_SECRET:-dev-pitstop-change-me}"
      JWT_ACCESS_TTL: "${JWT_ACCESS_TTL:-900}"
      JWT_REFRESH_TTL_DAYS: "${JWT_REFRESH_TTL_DAYS:-30}"
      OTP_TTL: "${OTP_TTL:-300}"
      OTP_EXPOSE_DEV_CODE: "${OTP_EXPOSE_DEV_CODE:-true}"
      LOG_REQUESTS: "${LOG_REQUESTS:-true}"
      DEFAULT_SHOP_ID: "${DEFAULT_SHOP_ID:-shop_pitstop_hsr}"
      # Firebase service-account file, mounted from ./secrets below.
      FIREBASE_CREDENTIALS_FILE: "/app/secrets/firebase-service-account.json"
    ports:
      # Host port (default 4000) -> container 4000. Override with API_PORT.
      - "${API_PORT:-4000}:4000"
    volumes:
      # Read-only mount so the container can verify Firebase tokens.
      - ./secrets:/app/secrets:ro

volumes:
  pitstop-db-data:
